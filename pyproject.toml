[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-company"
version = "0.1.0"
description = "Local-first, owner-gated AI team coordinator"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
local-company = "local_company.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

