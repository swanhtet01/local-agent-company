name: CodeQL

# Static security analysis for the Python sources. This project ships a
# local-first runtime that reads the filesystem, launches processes, drives
# the desktop, and speaks to a loopback model server, so the interesting
# findings here are injection, path traversal, and unsafe deserialization -
# not dependency CVEs (there are no third-party dependencies).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    # Weekly, so a newly published query still finds an idle repository.
    - cron: "31 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Required to upload results to the code scanning dashboard.
      security-events: write
      # Required by the CodeQL action to read workflow run metadata.
      actions: read
      contents: read

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Python is interpreted: there is nothing to compile, and the
          # project declares `dependencies = []`, so there is no install
          # step for CodeQL to observe either.
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
